name: Collect assets

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          UNSPLASH_KEY: ${{ secrets.UNSPLASH_KEY }}
          FREESOUND_KEY: ${{ secrets.FREESOUND_KEY }}
        run: npm run assets:collect:all 2>&1 | tee collect.log
      - run: npm run assets:credits
      - run: npm run assets:verify
      - name: Summary
        run: |
          echo "## Asset collection" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 collect.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rm -f collect.log
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: assets/auto-update
          title: 'chore: weekly asset update'
          commit-message: 'chore: update collected assets'
          body: Automated asset collection. Review licenses in CREDITS.md before approving.
