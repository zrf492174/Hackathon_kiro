name: Collect literature

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Collect
        run: npm run lit:collect 2>&1 | tee collect.log
      - run: npm run lit:verify
      - name: Summary
        run: |
          echo "## Literature collection" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 60 collect.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          rm -f collect.log
      - uses: peter-evans/create-pull-request@v6
        with:
          branch: literature/auto-update
          title: 'chore: weekly literature update'
          commit-message: 'chore: update grimoire and gazette datasets'
          body: Automated metadata collection (no full text). Review entries and sample flags before merging.
